{% extends 'base.html' %}

{% block content %}
<!-- Main Wrapper: Clean Light Theme (White/Gray/Purple) -->
<div class="bg-gray-50 min-h-screen py-12 px-4 sm:px-6 lg:px-8 font-sans text-gray-800">

    <div class="max-w-3xl mx-auto">
        <!-- Header Section -->
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-4xl font-black text-gray-900 tracking-tight uppercase mb-3">Get in Touch</h1>
            <p class="text-gray-500 font-medium">Have questions about the Player Profile System? Send us a message and our team will get back to you shortly.</p>
        </div>

        <!-- Contact Form Card -->
        <div class="bg-white rounded-xl border border-gray-200 shadow-sm p-6 md:p-10">
            <form action="#" method="POST" class="space-y-6">
                {% csrf_token %}

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- First Name -->
                    <div>
                        <label for="first_name" class="block text-xs font-bold text-gray-700 uppercase tracking-widest mb-2">First Name</label>
                        <input type="text" name="first_name" id="first_name" placeholder="John" required
                               class="bg-white text-gray-900 border border-gray-300 rounded-lg px-4 py-2.5 w-full focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 text-sm transition shadow-sm">
                    </div>
                    <!-- Last Name -->
                    <div>
                        <label for="last_name" class="block text-xs font-bold text-gray-700 uppercase tracking-widest mb-2">Last Name</label>
                        <input type="text" name="last_name" id="last_name" placeholder="Doe" required
                               class="bg-white text-gray-900 border border-gray-300 rounded-lg px-4 py-2.5 w-full focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 text-sm transition shadow-sm">
                    </div>
                </div>

                <!-- Email Address -->
                <div>
                    <label for="email" class="block text-xs font-bold text-gray-700 uppercase tracking-widest mb-2">Email Address</label>
                    <input type="email" name="email" id="email" placeholder="john@example.com" required
                           class="bg-white text-gray-900 border border-gray-300 rounded-lg px-4 py-2.5 w-full focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 text-sm transition shadow-sm">
                </div>

                <!-- Inquiry Type -->
                <div>
                    <label for="subject" class="block text-xs font-bold text-gray-700 uppercase tracking-widest mb-2">Subject</label>
                    <select name="subject" id="subject" required
                            class="bg-white text-gray-900 border border-gray-300 rounded-lg px-4 py-2.5 w-full focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 text-sm transition shadow-sm appearance-none">
                        <option value="" disabled selected>Select an inquiry type...</option>
                        <option value="support">Technical Support</option>
                        <option value="sales">Sales & Pricing</option>
                        <option value="partnership">Partnership Opportunities</option>
                        <option value="other">Other</option>
                    </select>
                </div>

                <!-- Message -->
                <div>
                    <label for="message" class="block text-xs font-bold text-gray-700 uppercase tracking-widest mb-2">Message</label>
                    <textarea name="message" id="message" rows="5" placeholder="How can we help you?" required
                              class="bg-white text-gray-900 border border-gray-300 rounded-lg px-4 py-2.5 w-full focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 text-sm transition shadow-sm resize-none"></textarea>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button type="submit"
                            class="w-full bg-purple-600 hover:bg-purple-700 text-white font-bold px-6 py-3 rounded-lg text-sm uppercase tracking-widest transition shadow-md hover:shadow-lg hover:-translate-y-0.5 flex justify-center items-center gap-2">
                        <span>Send Message</span>
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                    </button>
                </div>
            </form>
        </div>

        <!-- Extra Contact Info -->
        <div class="mt-8 flex flex-col md:flex-row justify-center items-center gap-6 text-sm text-gray-500">
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path></svg>
                <span>support@playersystem.org</span>
            </div>
            <div class="hidden md:block w-1.5 h-1.5 bg-gray-300 rounded-full"></div>
            <div class="flex items-center gap-2">
                <svg class="w-5 h-5 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                <span>Global HQ</span>
            </div>
        </div>
    </div>
</div>
{% endblock %}
